<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinimalShop | Modern Essentials</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --dark: #1e293b;
            --text-main: #334155;
            --text-muted: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
            --accent: #f59e0b;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark);
            text-decoration: none;
            letter-spacing: -0.025em;
        }

        .logo span {
            color: var(--primary);
        }

        .cart-trigger {
            position: relative;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: var(--transition);
        }

        .cart-trigger:hover {
            background-color: #f1f5f9;
        }

        .cart-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background-color: var(--accent);
            color: var(--dark);
            font-size: 0.75rem;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--white);
        }

        /* Hero Section */
        .hero {
            padding: 4rem 2rem;
            text-align: center;
            background: linear-gradient(to bottom, #ffffff, var(--light));
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.25rem;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        /* Product Grid */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--white);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #f1f5f9;
        }

        .product-info {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .add-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: auto;
        }

        .add-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Cart Side Panel */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .cart-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .cart-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background-color: var(--white);
            z-index: 201;
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            transform: translateX(100%);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .cart-panel.active {
            transform: translateX(0);
        }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .cart-item-img {
            width: 60px;
            height: 60px;
            border-radius: 0.5rem;
            object-fit: cover;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-name {
            font-weight: 600;
            font-size: 0.95rem;
            display: block;
        }

        .cart-item-price {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .remove-item {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid #e2e8f0;
            background-color: var(--light);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .checkout-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--dark);
            color: var(--white);
            border: none;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .checkout-btn:hover {
            background-color: #000;
        }

        .empty-cart-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.25rem; }
            .container { padding: 0 1rem 2rem; }
            header { padding: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Minimal<span>Shop</span></a>
        <button class="cart-trigger" id="cartToggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="cart-badge" id="cartBadge">0</span>
        </button>
    </header>

    <section class="hero">
        <h1>Elevate Your Space</h1>
        <p>Curated minimalist essentials designed for the modern home. Simple, functional, and timeless.</p>
    </section>

    <div class="container">
        <div class="product-grid" id="productGrid">
            <!-- Products injected here -->
        </div>
    </div>

    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" id="closeCart">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- Cart items injected here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Checkout Now</button>
        </div>
    </aside>

    <script>
        const PRODUCTS = [
            { id: 1, name: 'Wireless Noise-Cancelling Headphones', price: 249.99, image: 'https://picsum.photos/id/26/300/300' },
            { id: 2, name: 'Minimalist Desk Lamp', price: 89.00, image: 'https://picsum.photos/id/160/300/300' },
            { id: 3, name: 'Ergonomic Wireless Mouse', price: 59.99, image: 'https://picsum.photos/id/180/300/300' },
            { id: 4, name: 'Mechanical Backlit Keyboard', price: 129.50, image: 'https://picsum.photos/id/201/300/300' },
            { id: 5, name: 'Premium Leather Journal', price: 34.00, image: 'https://picsum.photos/id/24/300/300' },
            { id: 6, name: 'Aluminum Laptop Stand', price: 45.00, image: 'https://picsum.photos/id/48/300/300' },
            { id: 7, name: 'Ceramic Coffee Mug', price: 18.00, image: 'https://picsum.photos/id/1060/300/300' },
            { id: 8, name: 'Smart Home Speaker', price: 199.00, image: 'https://picsum.photos/id/30/300/300' },
        ];

        let cart = [];

        const productGrid = document.getElementById('productGrid');
        const cartItemsContainer = document.getElementById('cartItems');
        const cartBadge = document.getElementById('cartBadge');
        const cartTotal = document.getElementById('cartTotal');
        const cartPanel = document.getElementById('cartPanel');
        const cartOverlay = document.getElementById('cartOverlay');
        const cartToggle = document.getElementById('cartToggle');
        const closeCart = document.getElementById('closeCart');
        const checkoutBtn = document.getElementById('checkoutBtn');

        function init() {
            renderProducts();
            updateCartUI();
        }

        function renderProducts() {
            productGrid.innerHTML = PRODUCTS.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <button class="add-btn" onclick="addToCart(${product.id})">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = PRODUCTS.find(p => p.id === id);
            cart.push(product);
            updateCartUI();

            // Subtle feedback: Open cart automatically on first add
            if (cart.length === 1) {
                toggleCart(true);
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            // Update Badge
            cartBadge.textContent = cart.length;

            // Update Cart List
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="empty-cart-msg">
                        <p>Your cart is currently empty.</p>
                    </div>
                `;
                cartTotal.textContent = '$0.00';
            } else {
                cartItemsContainer.innerHTML = cart.map((item, index) => `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}" class="cart-item-img">
                        <div class="cart-item-details">
                            <span class="cart-item-name">${item.name}</span>
                            <span class="cart-item-price">$${item.price.toFixed(2)}</span>
                        </div>
                        <button class="remove-item" onclick="removeFromCart(${index})">Remove</button>
                    </div>
                `).join('');

                const total = cart.reduce((sum, item) => sum + item.price, 0);
                cartTotal.textContent = `$${total.toFixed(2)}`;
            }
        }

        function toggleCart(forceOpen = null) {
            const isOpen = forceOpen !== null ? !forceOpen : cartPanel.classList.contains('active');
            if (isOpen) {
                cartPanel.classList.remove('active');
                cartOverlay.classList.remove('active');
            } else {
                cartPanel.classList.add('active');
                cartOverlay.classList.add('active');
            }
        }

        cartToggle.addEventListener('click', () => toggleCart());
        closeCart.addEventListener('click', () => toggleCart());
        cartOverlay.addEventListener('click', () => toggleCart());

        checkoutBtn.addEventListener('click', () => {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            alert('Thank you for your purchase! Your order has been placed.');
            cart = [];
            updateCartUI();
            toggleCart();
        });

        window.onload = init;
    </script>
</body>
</html>
